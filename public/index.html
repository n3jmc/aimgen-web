<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Image Gen — Smart Prompt</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #0f0f1a;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 28px;
            max-width: 680px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 4px;
        }
        .sub {
            color: #aaa;
            margin-bottom: 20px;
        }
        .model-status {
            font-size: 0.8rem;
            padding: 6px 16px;
            border-radius: 40px;
            background: #14142a;
            display: inline-block;
            margin-bottom: 8px;
            min-width: 200px;
        }
        .model-status.loading { color: #feca57; }
        .model-status.ready { color: #2ed573; }
        .model-status.failed { color: #ff4757; }
        .progress-wrap {
            width: 100%;
            height: 6px;
            background: #2a2a42;
            border-radius: 10px;
            margin: 8px 0 16px;
            overflow: hidden;
            display: none;
        }
        .progress-wrap.visible { display: block; }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #7c5cfc, #a78bfa);
            border-radius: 10px;
            transition: width 0.2s ease;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 40px;
            border: none;
            background: #2a2a42;
            color: #fff;
            font-size: 1rem;
            outline: 1px solid #444;
            transition: 0.2s;
        }
        input:focus {
            outline: 2px solid #7c5cfc;
        }
        input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        button {
            margin-top: 16px;
            background: #7c5cfc;
            border: none;
            padding: 14px 32px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 0 #4f3a9e;
            width: 100%;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4f3a9e;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 6px 0 #4f3a9e;
        }
        .image-wrapper {
            position: relative;
            margin-top: 20px;
            border-radius: 16px;
            overflow: hidden;
            background: #222;
        }
        #result {
            display: block;
            width: 100%;
            height: auto;
            min-height: 200px;
            object-fit: cover;
            transition: opacity 0.3s;
            border: 2px solid #333;
            border-radius: 16px;
        }
        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            color: #fff;
            gap: 12px;
            backdrop-filter: blur(2px);
        }
        .image-overlay .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #333;
            border-top: 4px solid #7c5cfc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .image-overlay .label {
            font-size: 1.1rem;
            font-weight: 500;
            color: #ccc;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .prep-wrapper {
            margin-top: 20px;
            text-align: left;
            background: #0a0a18;
            border-radius: 16px;
            border: 1px solid #2a2a42;
            overflow: hidden;
            transition: all 0.3s;
        }
        .prep-header {
            padding: 10px 16px;
            background: #14142a;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.9rem;
            color: #888;
            user-select: none;
        }
        .prep-header:hover {
            background: #1a1a32;
        }
        .prep-header .arrow {
            transition: transform 0.3s;
            font-size: 0.8rem;
        }
        .prep-header .arrow.open {
            transform: rotate(180deg);
        }
        .prep-body {
            padding: 12px 16px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #b0b0d0;
            background: #0a0a18;
            transition: max-height 0.4s ease, padding 0.3s;
        }
        .prep-body.collapsed {
            max-height: 0;
            padding: 0 16px;
            overflow: hidden;
        }
        .prep-body .step {
            opacity: 0;
            animation: fadeInStep 0.4s forwards;
        }
        @keyframes fadeInStep {
            to { opacity: 1; }
        }
        .prep-body .step+.step {
            margin-top: 8px;
        }
        .prep-body .highlight {
            color: #7c5cfc;
        }
        .prep-body .json-box {
            background: #0d0d20;
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 3px solid #7c5cfc;
            margin-top: 4px;
            white-space: pre-wrap;
            font-size: 0.8rem;
            color: #c0c0e0;
            max-height: 120px;
            overflow-y: auto;
        }
        .prep-body .json-box::-webkit-scrollbar {
            width: 4px;
        }
        .prep-body .json-box::-webkit-scrollbar-track {
            background: #14142a;
        }
        .prep-body .json-box::-webkit-scrollbar-thumb {
            background: #7c5cfc;
            border-radius: 10px;
        }
        .error-msg {
            color: #ff4757;
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
        }
        .footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #2a2a42;
            font-size: 0.8rem;
            color: #666;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        /* ---- Edit button under image ---- */
        .action-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .action-row button {
            width: auto;
            padding: 8px 20px;
            margin: 0;
            font-size: 0.9rem;
            box-shadow: 0 4px 0 #4f3a9e;
            flex: 0 1 auto;
        }
        .action-row button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #4f3a9e;
        }
        .btn-edit {
            background: #feca57;
            color: #1a1a2e;
        }
        /* ---- Modal ---- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 28px;
            max-width: 500px;
            width: 100%;
            border: 1px solid #333;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }
        .modal-box h2 {
            margin-bottom: 12px;
            font-size: 1.4rem;
        }
        .modal-box textarea {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid #444;
            background: #0f0f1a;
            color: #eee;
            font-size: 1rem;
            resize: vertical;
            min-height: 100px;
            font-family: system-ui, sans-serif;
            outline: none;
        }
        .modal-box textarea:focus {
            border-color: #7c5cfc;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .modal-actions button {
            flex: 1;
            margin: 0;
        }
        .btn-cancel {
            background: #444;
            box-shadow: 0 4px 0 #222;
        }
        .btn-cancel:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #222;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 AI Image Gen</h1>
        <p class="sub">Describe what you want to see</p>

        <div id="modelStatus" class="model-status loading">⏳ Loading AI model...</div>
        <div class="progress-wrap" id="progressWrap">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <input type="text" id="prompt" placeholder="e.g., cat astronaut on Mars" disabled />
        <button id="generateBtn" disabled>✨ Generate</button>

        <div class="prep-wrapper" id="prepWrapper">
            <div class="prep-header" id="prepToggle">
                <span>📋 Preparation details</span>
                <span class="arrow" id="prepArrow">▼</span>
            </div>
            <div class="prep-body" id="prepBody"></div>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <div class="image-wrapper">
            <img id="result" src="" alt="Your generated image" />
            <div id="imageOverlay" class="image-overlay">
                <div class="spinner"></div>
                <div class="label">Generating…</div>
            </div>
        </div>

        <!-- Action row: Edit Prompt -->
        <div class="action-row" id="actionRow" style="display:none;">
            <button class="btn-edit" id="editPromptBtn">✏️ Edit Prompt</button>
        </div>

        <div class="footer">
            <span>⚡ Powered by Pollinations.ai</span>
            <span>🧠 AI Enhancer: FLAN-T5 (browser)</span>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <h2>✏️ Edit Prompt</h2>
            <p style="color:#aaa;font-size:0.9rem;margin-bottom:12px;">Edit the enhanced prompt below to fix the image.</p>
            <textarea id="editTextarea"></textarea>
            <div class="modal-actions">
                <button class="btn-cancel" id="cancelEditBtn">Cancel</button>
                <button id="regenerateBtn">🔄 Regenerate</button>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "@xenova/transformers": "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.0/dist/transformers.min.js"
        }
    }
    </script>

    <script type="module">
        import { pipeline, env } from '@xenova/transformers';

        env.remoteHost = 'https://huggingface.co';

        // ---- DOM refs ----
        const promptInput = document.getElementById('prompt');
        const generateBtn = document.getElementById('generateBtn');
        const resultImg = document.getElementById('result');
        const errorDiv = document.getElementById('errorMsg');
        const prepBody = document.getElementById('prepBody');
        const prepToggle = document.getElementById('prepToggle');
        const prepArrow = document.getElementById('prepArrow');
        const imageOverlay = document.getElementById('imageOverlay');
        const modelStatus = document.getElementById('modelStatus');
        const progressWrap = document.getElementById('progressWrap');
        const progressBar = document.getElementById('progressBar');
        const actionRow = document.getElementById('actionRow');
        const editPromptBtn = document.getElementById('editPromptBtn');
        const editModal = document.getElementById('editModal');
        const editTextarea = document.getElementById('editTextarea');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const regenerateBtn = document.getElementById('regenerateBtn');

        let prepExpanded = true;
        let model = null;
        let modelReady = false;
        let progressInterval = null;

        // ---- Store current prompts ----
        let currentOriginal = '';
        let currentEnhanced = '';

        // ---- Toggle prep ----
        prepToggle.addEventListener('click', () => {
            prepExpanded = !prepExpanded;
            prepBody.classList.toggle('collapsed', !prepExpanded);
            prepArrow.classList.toggle('open', prepExpanded);
        });

        // ---- Helper: append step ----
        function appendStep(html, delay = 0) {
            return new Promise(resolve => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = 'step';
                    div.innerHTML = html;
                    prepBody.appendChild(div);
                    prepBody.scrollTop = prepBody.scrollHeight;
                    resolve();
                }, delay);
            });
        }

        // ---- Local fallback enhancer ----
        function enhanceLocally(raw) {
            const styleMap = {
                'cat': 'furry, detailed fur, expressive eyes',
                'dog': 'fluffy, playful, detailed coat',
                'city': 'urban, neon lights, skyscrapers, busy streets',
                'sunset': 'golden hour, warm colors, dramatic sky',
                'forest': 'dense trees, mystical, sun rays through leaves',
                'space': 'stars, nebula, cosmic, otherworldly',
                'cyberpunk': 'neon, rain, futuristic, high-tech',
                'fantasy': 'magical, epic, mythical creatures, glowing',
                'portrait': 'detailed face, expressive, realistic skin texture',
                'animal': 'wildlife, detailed fur/feathers, natural lighting',
            };
            let enhanced = raw;
            for (const [key, value] of Object.entries(styleMap)) {
                if (raw.toLowerCase().includes(key)) {
                    enhanced += `, ${value}`;
                    break;
                }
            }
            enhanced += `, highly detailed, sharp focus, photorealistic, 8k, cinematic lighting, masterpiece`;
            return enhanced;
        }

        // ---- Set progress ----
        function setProgress(value) {
            progressBar.style.width = Math.min(100, Math.max(0, value)) + '%';
        }

        // ---- Load AI model ----
        async function loadModel() {
            progressWrap.classList.add('visible');
            setProgress(0);
            promptInput.disabled = true;
            generateBtn.disabled = true;
            modelStatus.textContent = '⏳ Loading AI model...';
            modelStatus.className = 'model-status loading';

            try {
                let simulatedProgress = 0;
                progressInterval = setInterval(() => {
                    simulatedProgress += Math.random() * 5 + 2;
                    if (simulatedProgress > 90) simulatedProgress = 90;
                    setProgress(simulatedProgress);
                }, 300);

                env.onProgress = (progress) => {
                    if (progress.progress !== undefined) {
                        setProgress(Math.min(90, progress.progress * 100));
                    }
                };

                try {
                    model = await pipeline('text2text-generation', 'Xenova/flan-t5-small');
                } catch (e) {
                    console.warn('FLAN-T5-small failed, trying tiny-random-t5...', e);
                    model = await pipeline('text2text-generation', 'Xenova/tiny-random-t5');
                }

                clearInterval(progressInterval);
                setProgress(100);
                modelReady = true;
                modelStatus.textContent = '✅ AI model ready! (FLAN-T5)';
                modelStatus.className = 'model-status ready';
                promptInput.disabled = false;
                generateBtn.disabled = false;
                setTimeout(() => progressWrap.classList.remove('visible'), 600);
            } catch (err) {
                clearInterval(progressInterval);
                console.error('Model load error:', err);
                modelStatus.textContent = '⚠️ AI model failed. Using local enhancer.';
                modelStatus.className = 'model-status failed';
                modelReady = false;
                promptInput.disabled = false;
                generateBtn.disabled = false;
                progressWrap.classList.remove('visible');
            }
        }

        // ---- AI rewrite ----
        async function rewriteWithAI(raw) {
            if (!modelReady || !model) {
                return enhanceLocally(raw);
            }
            const instruction =
                `Rewrite this prompt for an AI image generator to produce a highly realistic photograph. Add details about lighting, composition, texture, and color. Avoid surreal, abstract, or distorted elements. Output only the rewritten prompt: "${raw}"`;
            try {
                const result = await model(instruction, {
                    max_new_tokens: 100,
                    temperature: 0.6,
                });
                let rewritten = result[0]?.generated_text || raw;
                if (rewritten.includes(raw) && rewritten.length > raw.length + 20) {
                    const parts = rewritten.split(raw);
                    if (parts.length > 1) rewritten = parts[1].trim();
                }
                if (!rewritten || rewritten.length < 3) rewritten = enhanceLocally(raw);
                return rewritten;
            } catch (err) {
                console.error('AI rewrite error:', err);
                return enhanceLocally(raw);
            }
        }

        // ---- Generate image from a given prompt (used by both main and edit) ----
        function generateImageFromPrompt(enhancedPrompt, originalPrompt, callback) {
            const seed = Math.floor(Math.random() * 1000000);
            const cacheBuster = Date.now();
            const url =
                `https://image.pollinations.ai/prompt/${encodeURIComponent(enhancedPrompt)}?width=512&height=512&nologo=true&seed=${seed}&_=${cacheBuster}`;

            resultImg.src = url;

            const finish = () => {
                imageOverlay.style.display = 'none';
                prepBody.classList.add('collapsed');
                prepExpanded = false;
                prepArrow.classList.remove('open');
                errorDiv.style.display = 'none';
                actionRow.style.display = 'flex';
                if (callback) callback();
            };

            resultImg.onload = finish;
            resultImg.onerror = () => {
                imageOverlay.style.display = 'none';
                errorDiv.textContent = '❌ Generation failed. Try again or change your prompt.';
                errorDiv.style.display = 'block';
                prepBody.classList.add('collapsed');
                prepExpanded = false;
                prepArrow.classList.remove('open');
                actionRow.style.display = 'none';
                if (callback) callback();
            };

            // Fallback: hide overlay after 5s
            setTimeout(() => {
                if (imageOverlay.style.display !== 'none') {
                    imageOverlay.style.display = 'none';
                    prepBody.classList.add('collapsed');
                    prepExpanded = false;
                    prepArrow.classList.remove('open');
                    actionRow.style.display = 'flex';
                }
            }, 5000);
        }

        // ---- Main Generate (clears history) ----
        async function generateImage() {
            const rawPrompt = promptInput.value.trim();
            if (!rawPrompt) {
                alert('Please enter a description first.');
                return;
            }

            // CLEAR HISTORY (visual prep log)
            prepBody.innerHTML = '';
            prepBody.classList.remove('collapsed');
            prepExpanded = true;
            prepArrow.classList.add('open');

            imageOverlay.style.display = 'flex';
            errorDiv.style.display = 'none';
            actionRow.style.display = 'none';

            await appendStep(`<span class="spinner-inline" style="display:inline-block;width:14px;height:14px;border:2px solid #333;border-top:2px solid #7c5cfc;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px;"></span> <span class="highlight">Preparing...</span>`, 0);

            await appendStep(`🧠 <span class="highlight">AI rewriting prompt with realism focus...</span>`, 600);

            const enhanced = await rewriteWithAI(rawPrompt);
            currentOriginal = rawPrompt;
            currentEnhanced = enhanced;

            await appendStep(`📝 Original: "${rawPrompt}"`, 400);
            await appendStep(`✨ Enhanced: "${enhanced}"`, 600);

            await appendStep(`⚙️ <span class="highlight">Building JSON structure...</span>`, 400);

            const jsonObj = {
                original: rawPrompt,
                enhanced: enhanced,
                style: "photorealistic, sharp, cinematic",
                seed: Math.floor(Math.random() * 1000000),
                width: 512,
                height: 512,
                timestamp: new Date().toISOString()
            };
            const jsonStr = JSON.stringify(jsonObj, null, 2);
            await appendStep(`📦 <div class="json-box">${jsonStr}</div>`, 400);

            generateImageFromPrompt(enhanced, rawPrompt);
        }

        // ---- Regenerate from Edit (does NOT clear history) ----
        function regenerateFromEdit() {
            const newPrompt = editTextarea.value.trim();
            if (!newPrompt) {
                alert('Prompt cannot be empty.');
                return;
            }

            editModal.classList.remove('open');
            currentEnhanced = newPrompt;

            // Append a step (do NOT clear prepBody)
            appendStep(`✏️ <span class="highlight">User corrected prompt: "${newPrompt}"</span>`, 0);

            imageOverlay.style.display = 'flex';
            errorDiv.style.display = 'none';
            actionRow.style.display = 'none';

            generateImageFromPrompt(newPrompt, currentOriginal, () => {
                // Keep prep log open so user sees the correction
                prepBody.classList.remove('collapsed');
                prepExpanded = true;
                prepArrow.classList.add('open');
            });
        }

        // ---- Event listeners ----
        generateBtn.addEventListener('click', generateImage);
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') generateImage();
        });

        // Edit button → open modal
        editPromptBtn.addEventListener('click', () => {
            editTextarea.value = currentEnhanced || '';
            editModal.classList.add('open');
            editTextarea.focus();
        });

        // Cancel edit
        cancelEditBtn.addEventListener('click', () => {
            editModal.classList.remove('open');
        });

        // Regenerate from modal
        regenerateBtn.addEventListener('click', regenerateFromEdit);

        // Close modal on overlay click
        editModal.addEventListener('click', (e) => {
            if (e.target === editModal) editModal.classList.remove('open');
        });

        // ---- Init ----
        loadModel();
    </script>
</body>
</html>
