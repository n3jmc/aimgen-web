<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Image Gen — Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }
        body {
            background: #0a0a0a;
            color: #c0c0c0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        /* ---- TOP BAR ---- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 16px;
            background: #111;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .topbar h1 {
            font-size: 1.2rem;
            color: #7c5cfc;
            letter-spacing: 1px;
        }
        .topbar input[type="text"] {
            flex: 1;
            min-width: 140px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #eee;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }
        .topbar input:focus {
            border-color: #7c5cfc;
        }
        .topbar input:disabled {
            opacity: 0.4;
        }
        .topbar select {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #eee;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }
        .topbar select:focus {
            border-color: #7c5cfc;
        }
        .topbar button {
            background: #7c5cfc;
            border: none;
            color: #fff;
            padding: 8px 22px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 3px 0 #4f3a9e;
            white-space: nowrap;
        }
        .topbar button:active {
            transform: translateY(3px);
            box-shadow: 0 0px 0 #4f3a9e;
        }
        .topbar button:disabled {
            opacity: 0.4;
            transform: none;
            box-shadow: 0 3px 0 #4f3a9e;
            cursor: not-allowed;
        }
        .model-status {
            font-size: 0.7rem;
            color: #666;
            white-space: nowrap;
        }
        .model-status.ready {
            color: #2ed573;
        }
        .model-status.loading {
            color: #feca57;
        }
        .model-status.failed {
            color: #ff4757;
        }

        /* ---- MAIN PANEL (left + right) ---- */
        .main {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 12px;
            padding-top: 12px;
        }

        /* LEFT: Terminal log */
        .terminal {
            flex: 1;
            min-width: 200px;
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 12px 14px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.6;
            height: 100%;
            max-height: calc(100vh - 140px);
        }
        .terminal::-webkit-scrollbar {
            width: 5px;
        }
        .terminal::-webkit-scrollbar-track {
            background: #111;
        }
        .terminal::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 6px;
        }

        .terminal .line {
            opacity: 0;
            animation: fadeIn 0.3s forwards;
            padding: 2px 0;
            border-bottom: 1px solid #0f0f0f;
        }
        .terminal .line .highlight {
            color: #7c5cfc;
        }
        .terminal .line .dim {
            color: #555;
        }
        .terminal .line .green {
            color: #2ed573;
        }
        .terminal .line .yellow {
            color: #feca57;
        }
        .terminal .line .red {
            color: #ff4757;
        }
        .terminal .prompt-line {
            display: flex;
            gap: 6px;
            align-items: baseline;
        }
        .terminal .prompt-line .prompt-symbol {
            color: #7c5cfc;
            font-weight: bold;
        }

        /* Typing dot animation */
        .typing-dots::after {
            content: '';
            animation: dots 1.2s steps(3, end) infinite;
        }
        @keyframes dots {
            0% {
                content: '';
            }
            33% {
                content: '.';
            }
            66% {
                content: '..';
            }
            100% {
                content: '...';
            }
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* RIGHT: Gallery */
        .gallery {
            flex: 1.5;
            min-width: 200px;
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 12px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            align-content: start;
            max-height: calc(100vh - 140px);
        }
        .gallery::-webkit-scrollbar {
            width: 5px;
        }
        .gallery::-webkit-scrollbar-track {
            background: #111;
        }
        .gallery::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 6px;
        }

        .gallery .img-wrap {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #1a1a1a;
            transition: border 0.2s;
            aspect-ratio: 1/1;
            background: #141414;
        }
        .gallery .img-wrap:hover {
            border-color: #7c5cfc;
        }
        .gallery .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .gallery .img-wrap .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 0.7rem;
            background: #111;
        }
        .gallery .img-wrap .badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: #888;
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 4px;
            backdrop-filter: blur(2px);
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 640px) {
            .main {
                flex-direction: column;
            }
            .terminal {
                max-height: 40vh;
            }
            .gallery {
                max-height: 50vh;
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            .topbar {
                gap: 8px;
            }
            .topbar h1 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="topbar">
        <h1>⧩ AI</h1>
        <input type="text" id="prompt" placeholder="e.g., cat astronaut on Mars" disabled />
        <select id="countSelect">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
        <button id="generateBtn" disabled>⚡ Generate</button>
        <span class="model-status" id="modelStatus">⏳ loading...</span>
    </div>

    <!-- MAIN -->
    <div class="main">
        <!-- Left: Terminal -->
        <div class="terminal" id="terminal">
            <div class="line dim">⧩ Terminal ready.</div>
            <div class="line dim">Enter a prompt and hit Generate.</div>
        </div>

        <!-- Right: Gallery -->
        <div class="gallery" id="gallery"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "@xenova/transformers": "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.0/dist/transformers.min.js"
            }
        }
    </script>

    <script type="module">
        import { pipeline, env } from '@xenova/transformers';

        env.remoteHost = 'https://huggingface.co';

        // ---- DOM refs ----
        const promptInput = document.getElementById('prompt');
        const generateBtn = document.getElementById('generateBtn');
        const countSelect = document.getElementById('countSelect');
        const modelStatus = document.getElementById('modelStatus');
        const terminal = document.getElementById('terminal');
        const gallery = document.getElementById('gallery');

        let model = null;
        let modelReady = false;

        // ---- Terminal logging ----
        function logLine(html, cls = '') {
            const div = document.createElement('div');
            div.className = `line ${cls}`;
            div.innerHTML = html;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // ---- Local enhancer ----
        function enhanceLocally(raw) {
            const map = {
                'cat': 'furry, detailed fur, expressive eyes',
                'dog': 'fluffy, playful, detailed coat',
                'city': 'urban, neon lights, skyscrapers, busy streets',
                'sunset': 'golden hour, warm colors, dramatic sky',
                'forest': 'dense trees, mystical, sun rays through leaves',
                'space': 'stars, nebula, cosmic, otherworldly',
                'cyberpunk': 'neon, rain, futuristic, high-tech',
                'fantasy': 'magical, epic, mythical creatures, glowing',
                'portrait': 'detailed face, expressive, realistic skin texture',
                'animal': 'wildlife, detailed fur/feathers, natural lighting',
            };
            let e = raw;
            for (const [k, v] of Object.entries(map)) {
                if (raw.toLowerCase().includes(k)) { e += `, ${v}`; break; }
            }
            e += `, highly detailed, sharp focus, photorealistic, 8k, cinematic lighting, masterpiece`;
            return e;
        }

        // ---- AI rewrite ----
        async function rewriteWithAI(raw) {
            if (!modelReady || !model) return enhanceLocally(raw);
            const instruction =
                `Rewrite this prompt for an AI image generator to produce a highly realistic photograph. Add details about lighting, composition, texture, and color. Avoid surreal, abstract, or distorted elements. Output only the rewritten prompt: "${raw}"`;
            try {
                const result = await model(instruction, { max_new_tokens: 100, temperature: 0.6 });
                let rewritten = result[0]?.generated_text || raw;
                if (rewritten.includes(raw) && rewritten.length > raw.length + 20) {
                    const parts = rewritten.split(raw);
                    if (parts.length > 1) rewritten = parts[1].trim();
                }
                if (!rewritten || rewritten.length < 3) rewritten = enhanceLocally(raw);
                return rewritten;
            } catch {
                return enhanceLocally(raw);
            }
        }

        // ---- Generate N images ----
        async function generateImages() {
            const raw = promptInput.value.trim();
            if (!raw) { alert('Enter a prompt.'); return; }
            const count = parseInt(countSelect.value) || 3;

            // Disable UI
            generateBtn.disabled = true;
            promptInput.disabled = true;

            logLine(`<span class="prompt-symbol">➜</span> <span class="highlight">${raw}</span>`, '');

            // Rewrite
            logLine(`<span class="dim">⧩ AI rewriting...</span>`);
            const enhanced = await rewriteWithAI(raw);
            logLine(`<span class="dim">⧩ enhanced: </span><span class="highlight">${enhanced}</span>`);

            // Generate each image
            const baseUrl =
                `https://image.pollinations.ai/prompt/${encodeURIComponent(enhanced)}?width=512&height=512&nologo=true`;

            for (let i = 0; i < count; i++) {
                const seed = Math.floor(Math.random() * 1000000);
                const url = `${baseUrl}&seed=${seed}&_=${Date.now() + i}`;

                // Add placeholder
                const wrap = document.createElement('div');
                wrap.className = 'img-wrap';
                const placeholder = document.createElement('div');
                placeholder.className = 'placeholder';
                placeholder.textContent = `⏳ ${i+1}`;
                wrap.appendChild(placeholder);
                gallery.prepend(wrap);

                logLine(`<span class="dim">⧩ generating #${i+1} (seed ${seed})</span>`);

                // Load image
                const img = document.createElement('img');
                img.src = url;
                img.alt = `Image ${i+1}`;
                img.loading = 'lazy';

                // On load
                img.onload = () => {
                    wrap.innerHTML = '';
                    wrap.appendChild(img);
                    // badge
                    const badge = document.createElement('div');
                    badge.className = 'badge';
                    badge.textContent = `#${i+1}`;
                    wrap.appendChild(badge);
                    // click to enlarge
                    img.addEventListener('click', () => {
                        window.open(img.src, '_blank');
                    });
                };

                img.onerror = () => {
                    placeholder.textContent = `❌ #${i+1}`;
                    placeholder.style.color = '#ff4757';
                };

                // Small delay between calls to avoid rate-limit
                await new Promise(r => setTimeout(r, 300));
            }

            logLine(`<span class="green">✓ ${count} images generated.</span>`);

            // Re-enable UI
            generateBtn.disabled = false;
            promptInput.disabled = false;
            promptInput.focus();
        }

        // ---- Load model ----
        async function loadModel() {
            modelStatus.textContent = '⏳ loading model...';
            modelStatus.className = 'model-status loading';
            promptInput.disabled = true;
            generateBtn.disabled = true;

            try {
                model = await pipeline('text2text-generation', 'Xenova/flan-t5-small');
                modelReady = true;
                modelStatus.textContent = '✓ ready';
                modelStatus.className = 'model-status ready';
                promptInput.disabled = false;
                generateBtn.disabled = false;
                logLine(`<span class="green">✓ AI model loaded.</span>`);
            } catch (e) {
                console.warn('Model failed, using local enhancer.', e);
                modelReady = false;
                modelStatus.textContent = '⚠️ local mode';
                modelStatus.className = 'model-status failed';
                promptInput.disabled = false;
                generateBtn.disabled = false;
                logLine(`<span class="yellow">⚠️ AI model failed. Using local enhancer.</span>`);
            }
        }

        // ---- Events ----
        generateBtn.addEventListener('click', generateImages);
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') generateImages();
        });

        // ---- Init ----
        loadModel();

        // Add a clear button (optional) — double-click terminal to clear
        terminal.addEventListener('dblclick', () => {
            terminal.innerHTML = `<div class="line dim">⧩ Cleared.</div>`;
        });
    </script>
</body>
</html>
