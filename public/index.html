<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Image Gen — Plan & Build</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0f0f1a;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        /* ---- TOP BAR ---- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: #14142a;
            border-radius: 12px;
            flex-shrink: 0;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .topbar h1 {
            font-size: 1.2rem;
            color: #7c5cfc;
            font-weight: 700;
        }
        .topbar .mode-toggle {
            display: flex;
            gap: 4px;
            background: #0a0a1a;
            border-radius: 30px;
            padding: 4px;
        }
        .topbar .mode-toggle button {
            background: transparent;
            border: none;
            padding: 6px 18px;
            border-radius: 30px;
            color: #888;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .topbar .mode-toggle button.active {
            background: #7c5cfc;
            color: #fff;
            box-shadow: 0 0 20px #7c5cfc66;
        }
        .topbar .mode-toggle button:hover:not(.active) {
            color: #eee;
        }
        .topbar .model-status {
            font-size: 0.75rem;
            color: #666;
            margin-left: auto;
            white-space: nowrap;
        }
        .topbar .model-status.ready { color: #2ed573; }
        .topbar .model-status.loading { color: #feca57; }
        .topbar .model-status.failed { color: #ff4757; }
        .topbar .shortcut-hint {
            font-size: 0.7rem;
            color: #555;
            border: 1px solid #2a2a42;
            padding: 2px 10px;
            border-radius: 20px;
        }

        /* ---- MAIN PANEL ---- */
        .main {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 12px;
        }

        /* LEFT: Chat */
        .chat {
            flex: 1;
            min-width: 200px;
            background: #14142a;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #1a1a2e;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track { background: #0f0f1a; }
        .chat-messages::-webkit-scrollbar-thumb { background: #2a2a42; border-radius: 10px; }

        .message {
            max-width: 85%;
            padding: 10px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #2a2a42;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background: #1e1e32;
            border-bottom-left-radius: 4px;
        }
        .message .meta {
            font-size: 0.7rem;
            color: #666;
            margin-top: 4px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .message .image-preview {
            margin-top: 10px;
            border-radius: 12px;
            overflow: hidden;
            max-width: 100%;
        }
        .message .image-preview img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #2a2a42;
            display: block;
        }
        .progress-wrap {
            width: 100%;
            height: 6px;
            background: #2a2a42;
            border-radius: 10px;
            margin: 8px 0 4px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #7c5cfc, #a78bfa);
            width: 0%;
            border-radius: 10px;
            transition: width 0.15s linear;
        }

        .typing-dots::after {
            content: '';
            animation: dots 1.2s steps(3, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            33% { content: '.'; }
            66% { content: '..'; }
            100% { content: '...'; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-input {
            padding: 12px 16px;
            background: #0f0f1a;
            border-top: 1px solid #1a1a2e;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-input input {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #2a2a42;
            color: #eee;
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 0.95rem;
            outline: none;
        }
        .chat-input input:focus { border-color: #7c5cfc; }
        .chat-input input:disabled { opacity: 0.4; }
        .chat-input button {
            background: #7c5cfc;
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 3px 0 #4f3a9e;
        }
        .chat-input button:active {
            transform: translateY(3px);
            box-shadow: 0 0px 0 #4f3a9e;
        }
        .chat-input button:disabled {
            opacity: 0.4;
            transform: none;
            box-shadow: 0 3px 0 #4f3a9e;
            cursor: not-allowed;
        }

        /* ---- RIGHT: Gallery ---- */
        .gallery {
            flex: 1;
            min-width: 150px;
            max-width: 400px;
            background: #14142a;
            border-radius: 16px;
            padding: 16px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            align-content: start;
            border: 1px solid #1a1a2e;
        }
        .gallery::-webkit-scrollbar { width: 5px; }
        .gallery::-webkit-scrollbar-track { background: #0f0f1a; }
        .gallery::-webkit-scrollbar-thumb { background: #2a2a42; border-radius: 10px; }
        .gallery .img-wrap {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1a1a2e;
            aspect-ratio: 1/1;
            background: #0f0f1a;
        }
        .gallery .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .gallery .img-wrap .badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0,0,0,0.7);
            color: #888;
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .gallery .img-wrap .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 0.7rem;
            background: #0f0f1a;
        }
        .gallery-label {
            font-size: 0.7rem;
            color: #555;
            text-align: center;
            padding: 4px;
            grid-column: 1 / -1;
        }

        @media (max-width: 640px) {
            .main { flex-direction: column; }
            .gallery { max-width: none; max-height: 200px; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="topbar">
        <h1>🎨 Image Gen</h1>
        <div class="mode-toggle" id="modeToggle">
            <button class="active" data-mode="plan">📝 Plan</button>
            <button data-mode="build">⚡ Build</button>
        </div>
        <span class="shortcut-hint">Tab</span>
        <span class="model-status" id="modelStatus">⏳ loading...</span>
    </div>

    <!-- MAIN -->
    <div class="main">
        <!-- LEFT: Chat -->
        <div class="chat">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    👋 Welcome!<br>
                    <strong>Plan mode</strong> – discuss ideas.<br>
                    <strong>Build mode</strong> – say "Generate X images of Y" to create.
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="promptInput" placeholder="Type a message..." disabled />
                <button id="generateBtn" disabled>Send</button>
            </div>
        </div>

        <!-- RIGHT: Gallery -->
        <div class="gallery" id="gallery">
            <div class="gallery-label">📸 Gallery</div>
        </div>
    </div>

    <!-- IMPORTMAP -->
    <script type="importmap">
    {
        "imports": {
            "@xenova/transformers": "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.0/dist/transformers.min.js"
        }
    }
    </script>

    <script type="module">
        import { pipeline, env } from '@xenova/transformers';

        env.remoteHost = 'https://huggingface.co';

        // ---- DOM refs ----
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const modelStatus = document.getElementById('modelStatus');
        const chatMessages = document.getElementById('chatMessages');
        const gallery = document.getElementById('gallery');
        const modeButtons = document.querySelectorAll('#modeToggle button');

        // ---- State ----
        let model = null;
        let modelReady = false;
        let currentMode = 'plan'; // 'plan' or 'build'
        let conversationHistory = []; // [{role, content}]
        let imageCount = 0;

        // ---- Helpers ----
        function addMessage(text, type, extra = '') {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = text + extra;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return div;
        }

        function addImageToGallery(url, index) {
            const wrap = document.createElement('div');
            wrap.className = 'img-wrap';
            const img = document.createElement('img');
            img.src = url;
            img.alt = `Image ${index}`;
            img.loading = 'lazy';
            wrap.appendChild(img);
            const badge = document.createElement('div');
            badge.className = 'badge';
            badge.textContent = `#${index}`;
            wrap.appendChild(badge);
            img.addEventListener('click', () => window.open(url, '_blank'));
            gallery.insertBefore(wrap, gallery.firstChild);
        }

        // ---- Local enhancer ----
        function enhanceLocally(raw) {
            const map = {
                'cat': 'furry, detailed fur, expressive eyes',
                'dog': 'fluffy, playful, detailed coat',
                'city': 'urban, neon lights, skyscrapers, busy streets',
                'sunset': 'golden hour, warm colors, dramatic sky',
                'forest': 'dense trees, mystical, sun rays through leaves',
                'space': 'stars, nebula, cosmic, otherworldly',
                'cyberpunk': 'neon, rain, futuristic, high-tech',
                'fantasy': 'magical, epic, mythical creatures, glowing',
                'portrait': 'detailed face, expressive, realistic skin texture',
                'animal': 'wildlife, detailed fur/feathers, natural lighting',
            };
            let e = raw;
            for (const [k, v] of Object.entries(map)) {
                if (raw.toLowerCase().includes(k)) { e += `, ${v}`; break; }
            }
            e += `, highly detailed, sharp focus, photorealistic, 8k, cinematic lighting, masterpiece`;
            return e;
        }

        // ---- AI rewrite/discussion ----
        async function callModel(promptText) {
            if (!modelReady || !model) {
                // Fallback response
                return `[Model not loaded] I would discuss: "${promptText}" but I'm in fallback mode.`;
            }
            try {
                const result = await model(promptText, { max_new_tokens: 150, temperature: 0.7 });
                return result[0]?.generated_text || promptText;
            } catch {
                return `[Error] Could not generate response.`;
            }
        }

        // ---- Build mode: parse and generate ----
        async function handleBuildMode(userMessage) {
            // Check for "Generate X images of Y"
            const regex = /generate\s+(\d+)\s+images?\s+of\s+(.+)/i;
            const match = userMessage.match(regex);
            if (!match) {
                addMessage('ℹ️ Please say something like: "Generate 3 images of a cat"', 'ai');
                return;
            }
            const count = parseInt(match[1]);
            const subject = match[2].trim();
            if (count < 1 || count > 10) {
                addMessage('⚠️ Please specify a number between 1 and 10.', 'ai');
                return;
            }

            // Build a prompt using previous conversation context
            let context = '';
            if (conversationHistory.length > 0) {
                const lastFew = conversationHistory.slice(-4);
                context = lastFew.map(msg => `${msg.role}: ${msg.content}`).join('\n');
            }
            const instruction = `Based on the following conversation, generate a detailed image prompt for the subject: "${subject}". Include all discussed elements. Output only the prompt.`;
            const fullPrompt = context ? `Conversation:\n${context}\n\n${instruction}` : instruction;

            // Get enhanced prompt from model or local
            let enhanced;
            if (modelReady && model) {
                try {
                    const result = await model(fullPrompt, { max_new_tokens: 100, temperature: 0.6 });
                    enhanced = result[0]?.generated_text || enhanceLocally(subject);
                } catch {
                    enhanced = enhanceLocally(subject);
                }
            } else {
                enhanced = enhanceLocally(subject);
            }

            // Show the enhanced prompt
            addMessage(`🔍 Using enhanced prompt: "${enhanced}"`, 'ai');

            // Generate images
            const baseUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(enhanced)}?width=512&height=512&nologo=true`;

            for (let i = 0; i < count; i++) {
                const seed = Math.floor(Math.random() * 1000000);
                const url = `${baseUrl}&seed=${seed}&_=${Date.now() + i}`;

                const imgMsg = document.createElement('div');
                imgMsg.className = 'message ai';
                imgMsg.innerHTML = `
                    <div>🖼️ Generating image ${i+1}/${count} <span style="font-size:0.7rem;color:#666;">(seed: ${seed})</span></div>
                    <div class="progress-wrap"><div class="progress-bar" id="prog-${i}"></div></div>
                    <div style="font-size:0.8rem;color:#888;" id="pct-${i}">0%</div>
                    <div class="image-preview" id="prev-${i}"></div>
                `;
                chatMessages.appendChild(imgMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                const progressBar = document.getElementById(`prog-${i}`);
                const pctEl = document.getElementById(`pct-${i}`);
                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 6 + 2;
                    if (progress > 100) progress = 100;
                    progressBar.style.width = progress + '%';
                    if (pctEl) pctEl.textContent = Math.round(progress) + '%';
                    if (progress >= 100) clearInterval(interval);
                }, 80);

                const previewDiv = document.getElementById(`prev-${i}`);
                const img = document.createElement('img');
                img.src = url;
                img.alt = `Image ${i+1}`;
                img.onload = () => {
                    clearInterval(interval);
                    progressBar.style.width = '100%';
                    if (pctEl) pctEl.textContent = '100%';
                    previewDiv.innerHTML = '';
                    previewDiv.appendChild(img);
                    imageCount++;
                    addImageToGallery(url, imageCount);
                    setTimeout(() => {
                        const wrap = imgMsg.querySelector('.progress-wrap');
                        if (wrap) wrap.style.display = 'none';
                        const pct = imgMsg.querySelector('div[style*="font-size:0.8rem"]');
                        if (pct) pct.style.display = 'none';
                    }, 500);
                };
                img.onerror = () => {
                    clearInterval(interval);
                    previewDiv.innerHTML = `<span style="color:#ff4757;">❌ Failed</span>`;
                };

                // Delay between calls
                await new Promise(r => setTimeout(r, 400));
            }

            addMessage(`✅ Generated ${count} image${count>1?'s':''}.`, 'ai');
        }

        // ---- Main send function ----
        async function sendMessage() {
            const text = promptInput.value.trim();
            if (!text) return;

            // Disable UI
            generateBtn.disabled = true;
            promptInput.disabled = true;

            // Add user message
            addMessage(text, 'user');
            conversationHistory.push({ role: 'user', content: text });

            if (currentMode === 'plan') {
                // Plan mode: discuss
                const discussionPrompt = `The user said: "${text}". As an AI assistant, discuss ideas for an image based on this. Suggest elements, composition, lighting, style, and ask clarifying questions. Keep it conversational.`;
                const response = await callModel(discussionPrompt);
                addMessage(response, 'ai');
                conversationHistory.push({ role: 'assistant', content: response });
            } else {
                // Build mode
                await handleBuildMode(text);
                // The build mode adds its own messages and updates history? We don't push the AI generation responses to history because they are large. We can push a summary.
                // We'll push a summary of what was generated.
                conversationHistory.push({ role: 'assistant', content: `Generated images for: "${text}"` });
            }

            // Re-enable
            generateBtn.disabled = false;
            promptInput.disabled = false;
            promptInput.value = '';
            promptInput.focus();
        }

        // ---- Mode switching ----
        function setMode(mode) {
            currentMode = mode;
            modeButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            // Update input placeholder
            if (mode === 'plan') {
                promptInput.placeholder = '💬 Discuss your image idea...';
            } else {
                promptInput.placeholder = '⚡ Generate 3 images of a cat';
            }
        }

        // ---- Load model ----
        async function loadModel() {
            modelStatus.textContent = '⏳ loading model...';
            modelStatus.className = 'model-status loading';
            promptInput.disabled = true;
            generateBtn.disabled = true;

            try {
                model = await pipeline('text2text-generation', 'Xenova/flan-t5-small');
                modelReady = true;
                modelStatus.textContent = '✅ ready';
                modelStatus.className = 'model-status ready';
                promptInput.disabled = false;
                generateBtn.disabled = false;
                addMessage('🧠 AI model loaded.', 'ai');
            } catch (e) {
                console.warn('Model failed, using local fallback.', e);
                modelReady = false;
                modelStatus.textContent = '⚠️ local mode';
                modelStatus.className = 'model-status failed';
                promptInput.disabled = false;
                generateBtn.disabled = false;
                addMessage('⚠️ AI model failed. Using local enhancer (still works).', 'ai');
            }
        }

        // ---- Event listeners ----
        generateBtn.addEventListener('click', sendMessage);
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Mode toggle buttons
        modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                setMode(btn.dataset.mode);
            });
        });

        // Tab key to toggle mode
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const newMode = currentMode === 'plan' ? 'build' : 'plan';
                setMode(newMode);
                // Also update active button visually
                modeButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === newMode);
                });
            }
        });

        // ---- Init ----
        setMode('plan');
        loadModel();
    </script>
</body>
</html>
